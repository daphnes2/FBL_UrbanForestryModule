<!DOCTYPE html>


<html lang="en">


<head>
    <title>FBL Urban Forest Module</title>
    <meta property="og:description" content="FBL Urban Forest Module." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css'/>
    <link rel="stylesheet" href="./FBL_ForestMod_CSSC.css"> 
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
    <!--Default map Style-->
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>


<body>
    <!-- Map-->
        <div id="map"></div>
    <!--Filter Overlay Bar-->
        <div class="map-overlay top">
        <div class="map-overlay-inner">
            <nav id="nav-filter">


                <fieldset>
                    <legend style="font-size: 20px;">Ottawa Urban Forest Module</legend>
                    <label> Compiled by Forest Building Lab @ Carleton University </label>
                    <label> Last updated: August 2026 </label>    
                </fieldset>


                <fieldset>
                    <legend>🌳 Species Building Group</legend>
                    <div>
                        <select name="operator" id="operator-species-group">
                            <option value="all">Show all</option>
                            <!-- Options are populated from the speciesGroups object in JS -->
                        </select>
                    </div>
                </fieldset>


                <fieldset>
                    <legend>🌱 Planting Conditions</legend>
                    <div id="filtersPlantingConditions">
                        <label><input type="checkbox" value="HSURFACE"> Hard Surface</label>
                        <label><input type="checkbox" value="SSUPPORT"> Structural Support</label>
                        <label><input type="checkbox" value="TRGUARD"> Tree Guard</label>
                        <label><input type="checkbox" value="GRATE"> Grate</label>
                        <label><input type="checkbox" value="PLANTER"> Planter</label>
                        <label><input type="checkbox" value="STAKED"> Staked</label>
                        <label><input type="checkbox" value="WTUBES"> Watering Tubes</label>
                    </div>
                    <p style="font-size: 0.75rem; color: #777; margin: 6px 0 0;">
                        Leave all unchecked to show every tree. Checking one or more shows trees with any of the selected conditions.
                    </p>
                </fieldset>


                <fieldset>
                    <legend>📅📏 Physical Characteristics</legend>
                        <div class="slidercontainer">
                            <label>
                                Planted On or Before
                                <input id="plantDateSlider" type="range" min="1900" max="2026" step="1" value="2026">
                                <span id="plantDateValue"></span>
                            </label>
                            <label style="display:flex; align-items:center; gap:6px; font-size:0.75rem; color:#777;">
                                <input id="plantDateOnlyKnown" type="checkbox"> Only show trees with a known plant date
                            </label>
                        <div>
                            <label>
                                Diameter (cm) Up To
                                <input id="diameterSlider" type="range" min="0" max="150" step="1" value="150">
                                <span id="diameterValue"></span>
                            </label>
                        </div>
                    </div>
                </fieldset>


                <fieldset>
                    <button id="reset-filters" type="button">♻️ Reset Filters</button>
                </fieldset>


            </nav>
        </div>
        </div>
    <!--Reset Filters Button-->
        <button id="toggle-filters">❌ Hide Filters</button>
    <!--Linking to Javascript File-->
        <script src="./FBL_ForestMod_JSC.js"></script>
</body>


</html>
